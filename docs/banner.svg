<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="0 to Hero – Dein Einstieg in ein digitales Zeitalter">
  <defs>
    <pattern id="raster" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.6" fill="#2a2a2a"/>
    </pattern>
    <linearGradient id="verlauf" x1="0" x2="1">
      <stop offset="0" stop-color="#121212"/>
      <stop offset="1" stop-color="#0c0c0c"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#verlauf)"/>
  <rect width="1200" height="360" rx="24" fill="url(#raster)"/>
  <!-- Leiterbahn -->
  <path d="M0 300 H250 L290 260 H430" fill="none" stroke="#2a2a2a" stroke-width="4"/>
  <circle cx="430" cy="260" r="7" fill="none" stroke="#686868" stroke-width="3"/>
  <path d="M1200 70 H990 L950 110 H860" fill="none" stroke="#2a2a2a" stroke-width="4"/>
  <circle cx="860" cy="110" r="7" fill="none" stroke="#cba6f7" stroke-width="3"/>
  <!-- Logo: ovale Null -->
  <ellipse cx="220" cy="170" rx="58" ry="82" fill="none" stroke="#cba6f7" stroke-width="18"/>
  <text x="318" y="198" font-family="Atkinson Hyperlegible, Segoe UI, Helvetica, Arial, sans-serif" font-size="92" font-weight="700" fill="#e6e6e6">to Hero</text>
  <text x="322" y="252" font-family="Atkinson Hyperlegible, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" fill="#a0a0a0">Dein Einstieg in ein digitales Zeitalter</text>
  <!-- kleine LED -->
  <circle cx="1040" cy="230" r="26" fill="#cba6f7" opacity="0.18"/>
  <circle cx="1040" cy="230" r="13" fill="#dcc3fa"/>
  <line x1="1032" y1="243" x2="1032" y2="300" stroke="#686868" stroke-width="4"/>
  <line x1="1048" y1="243" x2="1048" y2="290" stroke="#686868" stroke-width="4"/>
</svg>
